[project]
name = "mispick"
version = "0.1.0"
description = "Find out which of your MCP tools the model mixes up - measured, not guessed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "llm", "tools", "evaluation", "confusion-matrix"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=2.2.0",
  "typer>=0.16.0",
  "rich>=13.9.4",
  "pydantic>=2.12.0",
  "jsonschema>=4.20.0",
  "pyyaml>=6.0",
  "openai>=1.60.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]

[project.scripts]
mispick = "mispick.cli:app"

[project.urls]
Homepage = "https://github.com/msc35/mispick"
Repository = "https://github.com/msc35/mispick"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-pyyaml>=6.0",
  "types-jsonschema>=4.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mispick"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# These render typographic dashes and middots into HTML/SVG/terminal output on purpose.
"src/mispick/report/*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:mispick.*"]
