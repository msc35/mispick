name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check src tests
      - name: Types
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      # The suite must pass with no network and no model backend. This is the check that
      # keeps that true.
      - name: Tests are offline
        run: uv run pytest -q
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          # Point outbound HTTP at a dead port, so a test that reaches the network fails
          # here instead of passing quietly because the runner happens to be online.
          # NO_PROXY='*' would do the opposite: it permits direct connections.
          HTTP_PROXY: 'http://127.0.0.1:9'
          HTTPS_PROXY: 'http://127.0.0.1:9'

  workflows:
    # Two failure modes that arrive with no job and no log, so they are checked here:
    # a workflow file GitHub rejects outright (e.g. two env keys differing only in case),
    # and a `uses:` pin whose tag does not exist, which fails job setup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color
      - name: Every action pin resolves
        run: python3 scripts/check_action_pins.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  action:
    # Proves action.yml at least parses and skips cleanly with no model key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          snapshot: tests/fixtures/confusing_tools.json
          comment: 'false'
      - name: The run should have skipped, not failed
        run: |
          test -f mispick-comment.md
          grep -q "skipped" mispick-comment.md
