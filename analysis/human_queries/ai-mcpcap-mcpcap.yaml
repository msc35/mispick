# Hand-written requests for ai-mcpcap-mcpcap
#
# Write what a real user would type to an assistant that has these tools.
# - At least 2 per tool and 20 in total. Include some hard cases.
# - Put each request under the tool that SHOULD be chosen.
# - kind: straightforward (default), paraphrased (indirect wording), or hard_negative
#   (sounds like a different tool, but this one is right). For a hard case, set
#   `neighbour:` to the tool it sounds like.
# - Give concrete details (names, paths, values). Never 'these' or 'that'.
# - Do NOT look at generated queries or benchmark results for this server first.
# - Requests no tool can answer go under no_tool at the bottom.
#
# Leave `fingerprint` alone: it ties these requests to this exact tool list.
version: 1
server: ai-mcpcap-mcpcap
tools:
  analyze_capinfos:
    # What this tool says it does:
    #   Return metadata from a PCAP file, similar to Wireshark's capinfos utility.
    #
    #   IMPORTANT: This tool expects a FILE PATH or URL, not file content.
    #   - For local files: "/path/to/capture.pcap"
    #   - For remote files: "https://example.com/capture.pcap"
    #   - File uploads are NOT supported - save the file locally first
    #
    #   Args:
    #       pcap_file: Path to local PCAP file or HTTP URL to remote PCAP file
    #                 (NOT file content - must be a path or URL)
    #
    #   Returns:
    #       A structured dictionary containing PCAP metadata including:
    #       - File information (size, name, encapsulation type)
    #       - Packet statistics (count, data size, average sizes)
    #       - Temporal data (duration, timestamps, rates)
    fingerprint: 1e55b5e3dc4516f7
    queries:
    - text: ""
      kind: straightforward
    - text: ""
      kind: straightforward
  analyze_dhcp_packets:
    # What this tool says it does:
    #   Analyze DHCP packets from a PCAP file and return comprehensive analysis results.
    #
    #   FILE UPLOAD LIMITATION: This MCP tool cannot process files uploaded through
    #   Claude's web interface. Files must be accessible via URL or local file path.
    #
    #   SUPPORTED INPUT FORMATS:
    #   - Remote files: "https://example.com/capture.pcap"
    #   - Local files: "/absolute/path/to/capture.pcap"
    #
    #   UNSUPPORTED:
    #   - Files uploaded through Claude's file upload feature
    #   - Base64 file content
    #   - Relative file paths
    #
    #   Args:
    #       pcap_file: HTTP URL or absolute local file path to PCAP file
    #
    #   Returns:
    #       A structured dictionary containing DHCP packet analysis results
    fingerprint: 139d4c9b27f4dcf8
    queries:
    - text: ""
      kind: straightforward
    - text: ""
      kind: straightforward
  analyze_dns_packets:
    # What this tool says it does:
    #   Analyze DNS packets from a PCAP file and return comprehensive analysis results.
    #
    #   FILE UPLOAD LIMITATION: This MCP tool cannot process files uploaded through
    #   Claude's web interface. Files must be accessible via URL or local file path.
    #
    #   SUPPORTED INPUT FORMATS:
    #   - Remote files: "https://example.com/capture.pcap"
    #   - Local files: "/absolute/path/to/capture.pcap"
    #
    #   UNSUPPORTED:
    #   - Files uploaded through Claude's file upload feature
    #   - Base64 file content
    #   - Relative file paths
    #
    #   Args:
    #       pcap_file: HTTP URL or absolute local file path to PCAP file
    #
    #   Returns:
    #       A structured dictionary containing DNS packet analysis results
    fingerprint: 9ac834945417d748
    queries:
    - text: ""
      kind: straightforward
    - text: ""
      kind: straightforward
  analyze_icmp_packets:
    # What this tool says it does:
    #   Analyze ICMP packets from a PCAP file and return comprehensive analysis results.
    #
    #   FILE UPLOAD LIMITATION: This MCP tool cannot process files uploaded through
    #   Claude's web interface. Files must be accessible via URL or local file path.
    #
    #   SUPPORTED INPUT FORMATS:
    #   - Remote files: "https://example.com/capture.pcap"
    #   - Local files: "/absolute/path/to/capture.pcap"
    #
    #   UNSUPPORTED:
    #   - Files uploaded through Claude's file upload feature
